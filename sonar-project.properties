sonar.projectKey=complytime_complyctl
sonar.organization=complytime

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=complyctl
#sonar.projectVersion=1.0

# Exclude vendored dependencies from analysis
sonar.exclusions=vendor/**

# Exclude test infrastructure and tooling from coverage metrics
sonar.coverage.exclusions=\
  tests/**,\
  cmd/test-provider/**,\
  cmd/mock-oci-registry/**,\
  cmd/behavioral-report/**

# Disable C/C++/Objective-C sensors (pure Go project)
sonar.c.file.suffixes=-
sonar.cpp.file.suffixes=-
sonar.objc.file.suffixes=-
